why = "A town's Supplies tab rates each cargo the town needs. Its Suppliers view draws arrows to every industry that could supply any of them, all at once, so the one cargo that is short is hard to follow."
what = "The Suppliers view gets the filter row: pick a cargo the town needs to see only where it can come from, on the map and in the table. The distance slider, the Producing toggle and the Distance column work here too."
how = [
  "Open a town and its Supplies tab.",
  "Switch to the Suppliers view and pick a cargo.",
]

