# ------------------------------------------------------------ filters and tables

[feature.distanceSlider]
where = ["industry-window", "town-window", "warehouse-window"]
why = "The arrows reach across the whole map, while a first supply chain usually starts with the industries close by. In a long table those are easy to miss."
what = "A slider in the filter row hides suppliers and consumers farther away than the distance it shows, both their arrows and their table rows. At the right end it reads All and hides nothing."
good = [
  "One limit for every window, kept for the session. The Supply Chain Planner uses it too.",
  "Distances are straight lines, not the length of a route.",
]

[[feature.distanceSlider.figure]]
caption = "Wellington Canning Factory's fish suppliers."
before_label = "All distances"
after_label = "Up to 8 km"
