modid = "tuatara_cargo_enhancements"
group = "enhancements"
order = 2
status = "soon"
publish = true
version = "0.28.4"
card = "Cargo flow filters for industries, towns and warehouses, and a supply chain planner."
card_image = "site/card-cargo-enhancements.webp"
lead = "The industry and town windows draw arrows to every industry and town that could supply or take their cargos, all at once. This mod filters them by cargo, distance and who actually produces, adds distances to the tables, gives warehouses the same view, and plans whole supply chains from the raw producers to the towns."
description = "Cargo Enhancements for Transport Fever 3: filters the cargo flow arrows and supplier and consumer tables of the industry, town and warehouse windows by cargo, distance and production, and adds a Supply Chain Planner."
hero = "CE-06d-all"
hero_alt = "Carlton Colville Warehouse on the map: white arrows fan out to every crop farm, cotton farm and oil refinery that could take its fertilizer or crude oil."
intro = """
In the game, expanding an industry's Input Stocks or Output Stocks card, or opening a town's Supplies tab, draws cargo flow arrows on the map to every possible supplier or consumer and lists them in a table below. The filters here work on both at once: pick a cargo or set a distance, and the arrows and the rows follow.
"""
compat = "Works alongside [Industry Enhancements](mod:industry-enhancements), whose worker count and list share the Boosters card, [Warehouse Enhancements](mod:warehouse-enhancements), whose Stocks card sits above Consumers and Suppliers in the warehouse window, and [To-Do List](mod:todo-list), whose cards share the industry, town and warehouse windows."

[[section]]
title = "Industry window"
features = ["cargoFilter", "boosterSources"]

[[section]]
title = "Town and warehouse windows"
features = ["townSupplies", "warehouseFlows"]

[[section]]
title = "Filters and tables in all three windows"
features = ["distanceSlider", "producingFilter", "distanceColumn", "tableSort"]

[[section]]
title = "Supply Chain Planner"
features = ["supplyChainPlanner", "plannerButton"]

# ------------------------------------------------------------ industry window

[feature.cargoFilter]
where = ["industry-window"]
why = "Expanding an industry's Input Stocks or Output Stocks card draws arrows to every industry and town that could supply or take any of its cargos, and lists them all in one table. For a canning factory that is every fishing ground, livestock farm and steel mill around."
what = "Cargo buttons above the table of an expanded Input Stocks or Output Stocks card: All, as in the game, and one button per cargo. Pick a cargo to keep only its arrows and table rows: the industries and towns that can supply it to this industry, or take it from it."
good = [
  "The choice is kept per industry for the session.",
  "A card with a single cargo has no buttons, since there is nothing to pick; the other filters still show.",
]

