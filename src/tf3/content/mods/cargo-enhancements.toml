[feature.plannerButton]
where = ["mod-buttons"]
why = "The planner covers the map, so you close it to build. Opening it again from the town or industry window takes a few clicks."
what = "A button beside the Data Layers button at the top left opens and closes the planner, back on the town or industry you last planned for, with its plan as you left it. Before anything is planned it opens empty: pick a town or an industry in its toolbar."
good = [
  "Needs the Supply Chain Planner setting on.",
]
