  { n = 4, x = 83.2, y = 38.5, text = "Who takes the meat: the town of Frodsham, 2.1 km away, is picked and already served by your line." },
  { n = 5, x = 79.6, y = 73, text = "The planned legs with distance, lines and balance, and a summary of what holds the chain back." },
