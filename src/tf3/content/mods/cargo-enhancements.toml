]

[feature.distanceColumn]
where = ["industry-window", "town-window", "warehouse-window"]
why = "The game's supplier and consumer tables give names and amounts, but not how far away each one is. A neighbour and a town at the far end of the map look the same."
what = "A Distance column in the supplier and consumer tables of the industry, town and warehouse windows: the straight-line distance to the other industry or town. Sort by it to put the nearest first."

[[feature.distanceColumn.figure]]
shot = "CE-02"
alt = "An Output Stocks card with meat picked, the slider at 6.0 km and four consumers sorted by distance, from 2.0 to 4.8 km."
