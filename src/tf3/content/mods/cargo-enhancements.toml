[feature.producingFilter]
where = ["industry-window", "town-window", "warehouse-window"]
why = "The supplier lists include every industry that could make a cargo, also the ones that made none last year because no line serves them. Four canning factories could supply a town with cans, but only one is making any."
what = "A Producing toggle (the factory icon) in the filter row. In the supplier filters it hides suppliers that produced none of the cargo in the last year. In the consumer filters (an industry's Output Stocks, a warehouse's Consumers) it hides consumer industries that produced nothing in the last year or threw almost all of it away; towns stay."
good = [
  "A mine nobody serves keeps producing into its full stock, which throws it all away, so as a consumer it counts as not producing. A booster such as tools then goes only where the extra production is used.",
  "Raw producers such as farms and mines always make something, so the toggle matters most for processed cargo such as cans.",
]

