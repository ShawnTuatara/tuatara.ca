[feature.gameScripts]
where = ["mod-buttons"]
why = """
Game scripts run on the simulation's threads, where a slow one costs game speed rather than frame rate. The interface's timings don't see them.
"""
what = """
With Monitor on, also times every mod's game scripts on the simulation threads: their update and event handlers and the functions their scripts share. The window's Sim column shows each mod's time in ms per real second over the last 30 seconds, a click on the mod its functions with their longest recent call, and the simulation line how much of the simulation's step time all mods' game scripts take.
"""
good = [
  "The parts of game scripts that run in the interface aren't timed.",
  "Their totals are kept in your save (a few KB) and dropped by the game once the mod is removed.",
]

[feature.hitchLog]
where = ["background"]
why = """
A hitch you noticed a minute ago may be gone from the window by the time you look, and a mod's author needs figures to act on.
"""
what = """
Writes each hitch to the game log (stdout.txt) with the mods that took the most of it, at most one line a second, and once a minute a count of the slow frames, the game speed (game time per real second, the engine's speed and its estimated maximum), the simulation's timings and the game scripts' time, to send to a mod's author.
"""
good = [
  "Off by default.",
]

[feature.destinationRecompute]
where = ["background"]
why = """
In big worlds the simulation, not the interface, often limits the game speed, and every time a person looks for a new job or shop the game searches routes.
"""
what = """
A test setting for simulation speed in big worlds: how often a person looks for a new job or shop. The game's own value is 100%; here 50%, 25% or 10%. Lower values mean fewer route searches, but people react more slowly to new lines and stations.
"""
good = [
  "Applied when a game loads; the window's simulation line shows the value in use.",
  "Leave it at 100% unless you are testing.",
]
