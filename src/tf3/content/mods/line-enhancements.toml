[feature.lineTiming]
where = ["line-window", "line-manager"]
why = "The Frequency alone can't say whether a line is slow, or why."
what = "A Timing card in the line window, after Vehicles: the normal loop (one vehicle round all stops on its best trips), the loop now (green, yellow or red against normal) and the frequency with its normal, then what slows the line, worst first, with what it costs in vehicles, such as 'Circling on the way to Hartha Airport: 1:31 a loop = 0.33 aircraft'."
good = [
  "Open the card for each leg's normal time against now, split into moving, the stop and each delay.",
  "The Line Manager's Frequency gets 'avg m:ss', the average time between departures from the first stop.",
  "The normal loop shows once each vehicle has gone round a few times.",
]

