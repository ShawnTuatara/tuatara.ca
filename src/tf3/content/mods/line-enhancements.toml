# ---------------------------------------------------------------- Line Manager: stops

[feature.distributeDelivery]
where = ["line-manager"]
why = "A delivery line that drops cargo at several stops unloads everything at the first stop that takes it. To share the cargo out down the line, you set a fill level at each stop by hand."
what = "A Distribute Delivery button in the Load card of a stop's window. For each cargo the stop loads, it gives the following stops that accept that cargo decreasing fill levels, up to the next stop that loads it again, and the last of them none, so the rest is delivered there."
how = [
  "In the Line Manager, open the window of the stop where the cargo is loaded.",
  "Point at **Distribute Delivery** in its Load card to see the plan, then click it.",
]
good = [
  "After a full pickup and three stops that take the cargo, they get 67 %, 33 % and none.",
  "It only sets fill levels; you can change any of them afterwards in each stop's Load card.",
]

