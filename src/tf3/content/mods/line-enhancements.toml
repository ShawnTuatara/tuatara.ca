[feature.vehicleManageLine]
where = ["vehicle-window", "station-window", "statistics", "line-window"]
why = "A vehicle's window, a station's terminals and the statistics table all name a line, but none leads to it in the Line Manager: you open the line's window first, then press Manage Line there."
what = "A Line Manager icon right of a line's name opens the Line Manager on that line. It shows in the vehicle window's Basics card, on each line's row under a terminal in the station window, and in the statistics window's Lines tab after the rename pencil. The line window's Manage Line button gets the same icon instead of the crossed arrows."
good = [
  "Hover the icon for its tooltip, Manage Line. A click does what the line window's Manage Line button does.",
  "Vehicles without a line show no icon.",
]

