# ---------------------------------------------------------------- statistics window

[feature.costViews]
where = ["statistics"]
why = "The statistics window's Lines tab shows Utilization as the load right now and Balance without any upkeep. It can't tell you which lines pay their way, which barely use their vehicles, or where track is over- or under-built."
what = "Three view buttons in the Lines tab, before the vehicle-type buttons. Lines: last year's use of the Rate as a bar beside the load now, Balance as a profit bar on one scale for all lines, and a Net column with the line's share of upkeep. Costs: every cost in its own column, plus the upkeep only this line uses. Track: the fastest vehicle's top speed, the route by track or road type, and the length held back by curves, over-built, under-built and shared."
good = [
  "Use is green from 70 %, yellow from 40 %, red below.",
  "Profit bar: income to the right, costs to the left (running, servicing, track and signals, stations, depots), faded where shared with other lines.",
  "Over-built: a cheaper track would do, with the upkeep it would save. Under-built: with the time lost per round trip.",
  "A line that earned nothing shows – for its income. A line that lost vehicles during the year can read '100%+' use.",
  "A line's share of upkeep: each track or road piece is split among the lines using it by vehicles passing, a station by stops, a depot by the vehicles it services.",
]

