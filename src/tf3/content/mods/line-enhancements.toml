  { n = 2, x = 52, y = 72.7, text = "Loop now: 13:10, 7 % slower, so yellow." },
  { n = 3, x = 82, y = 72.7, text = "One every 6:35, against 6:09 normally." },
  { n = 4, x = 3.7, y = 81, text = "What slows the line, worst first: spacing waits at the fishing grounds cost 0:16 a loop, 0.04 ships." },
]

[[feature.lineTiming.figure]]
shot = "LE-15"
alt = "The Timing card opened for a bus line: two findings, then one bar per leg split into colours, with its time at the right and a legend."
