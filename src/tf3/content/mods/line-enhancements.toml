modid = "tuatara_line_enhancements"
group = "enhancements"
order = 1
status = "soon"
publish = true
version = "1.0"
card = "Terminals, deliveries, stop figures, fleet sizing, line timing and line costs."
card_image = "site/card-line-enhancements.webp"
lead = "The game tells you little about how a line is doing: who waits at which stop, whether it has enough vehicles, what slows it down, and what it costs once upkeep is counted. Line Enhancements puts those figures in the Line Manager, the line window and the statistics window, and adds tools to set terminals, spread deliveries and see where cargo is wanted."
description = "Line Enhancements for Transport Fever 3: assign lines to terminals, spread deliveries over stops, see who waits for each line, vehicle loads, how many vehicles a line needs, what slows it, what it costs with all upkeep, where its cargo is wanted and where planes skip waypoints."
hero = "site/hero-cargo-demand"
hero_alt = "The Line Manager beside a town with a meat delivery line selected: blue pins on the buildings one stop reaches, red question marks on buildings no stop reaches, and a stored / capacity chip over a district."
intro = """
Every feature has its own Off / On switch in the mod's Settings (the gear next to the mod when you choose a game's mods), all On to start with.

The game keeps no history per vehicle or stop, so the mod records departures, loads, arrivals and delays while the game runs and keeps them in your save. Figures appear after the vehicles' next departures and grow more reliable over a game year. Removing the mod leaves an unused table in the save.
"""
compat = "Works alongside [Statistics Enhancements](mod:statistics-enhancements), whose Rank and Station columns share the statistics window, and [To-Do List](mod:todo-list), whose card shares the line window. It also runs beside square's Line Manager Plus, whose vehicle details gave the idea for the details on a vehicle's picture."

[[section]]
title = "Station window"
features = ["assignLines"]

[[section]]
title = "Line Manager: stops and loading"
features = ["distributeDelivery", "stopWaiting", "passengerToggle", "cargoRemoval"]

[[section]]
title = "Line Manager: vehicles"
features = ["vehicleStatus", "vehiclesNeeded", "selectedCount", "sendToLineFilter"]

[[section]]
title = "Line Manager: names"
features = ["destinationNames"]

[[section]]
title = "Line Manager: on the map"
features = ["districtColors", "lineCatchment", "cargoDemand", "descentZones"]

[[section]]
title = "Line window and vehicle window"
features = ["costCards", "lineTiming", "vehicleManageLine"]

[[section]]
title = "Statistics window"
features = ["costViews"]

# ---------------------------------------------------------------- station window

[feature.assignLines]
where = ["station-window", "statistics"]
why = "The game sets terminals one line and one stop at a time, in the Line Manager's stop popover. To see which lines use which terminal of a busy station, you open each line in turn."
what = "An Assign Lines button next to Configure in the station window opens a window with the station's terminals and the lines that stop there. Drag a line to another terminal to make it the preferred one, or add terminals as alternatives. A grid view shows every line against every terminal."
how = [
  "Open a station's window and click **Assign Lines** at the bottom.",
  "List view: drag a line by its grip onto another terminal to make it preferred, or drag the handle at the right of its row to add that terminal as an alternative.",
  "Grid view (the button at the top right): left-click a cell to make that terminal preferred, right-click to add or remove it as an alternative.",
]
good = [
  "Alternatives are listed greyed under a separator; the ✕ stops the line using that terminal.",
  "Colours show how a terminal suits a line: green made for its cargo, yellow made for other cargo (usable, unloads slower), red the line's trains can't reach it over the track.",
  "Passenger lines can't use cargo-only terminals, and the other way round.",
  "A change is the same as setting it in the Line Manager's stop popover. Click a line's name to open its line window.",
]
also = "The statistics window's Stations tab gets an Assign Lines button at the right of each Lines cell."

