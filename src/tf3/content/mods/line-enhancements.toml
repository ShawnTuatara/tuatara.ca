what = "A toggle at the end of the Line Manager's action bar (cargo and clock icon) turns the selected line's stop list into a Figures view: one row per stop and cargo with what waits there for this line, the vehicle loads that makes, the change since the last vehicle left, the unhappy passengers and the arrivals a year. Point at a stop's rows for a card with everything about it."
