# ---------------------------------------------------------------- line window and vehicle window

[feature.costCards]
where = ["line-window"]
why = "The line window's Balance counts only income and the vehicles' running costs. Servicing and the upkeep of track, stations and depots are left out, so a line can look profitable while it loses money."
what = "Two cards in the line window. Verdict: Profitable, Feeder or Unprofitable with the reason, and what the line earns, costs with all upkeep and enables; open it for usage and what would help. Costs & Value: a waterfall from income to the net; open it for what the line enables, what removing it would change, and every cost."
good = [
  "Enables: the lines carrying the output of an industry only this line supplies. A line that loses money but enables other lines' income is a Feeder.",
  "A line's share of upkeep: each track or road piece on its route is split among the lines using it by vehicles passing, a station by stops, a depot by the vehicles it services.",
  "The figures can take a moment to appear after the window opens.",
]

