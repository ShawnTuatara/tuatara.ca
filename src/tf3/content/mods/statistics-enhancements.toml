# ---------------------------------------------------------------- game bar

[feature.problemButtons]
where = ["game-bar", "statistics"]
why = "Some problems show only deep in a window or a table: an industry that can't expand, a warehouse about to fill up, a station where passengers pile up, a depot that can't keep up with maintenance. Nothing in the game bar tells you where to look."
what = """
The statistics buttons in the game bar turn red while their table has something to look at, so you see at a glance where to check. Hover a red button to see what it found and where, up to three names per kind; the button's hotkey stays beside its title.

Every table with a Problems column counts the elements with a problem notification, as that column shows them. Some buttons check more:

**Vehicles**: vehicles in very bad condition.

**Depots**: depots and maintenance buildings whose maintenance pool is full while vehicles in their maintenance area are maintained nowhere and wear down. The tooltip says how many, and how many vehicles the pool served in the last 30 days.

**Stations**: a terminal the station window marks as overcrowded; more passengers waiting for a line at a stop than all of that line's vehicles seat together, so the line needs more vehicles; or at least 10 unhappy passengers who make up 30 % of those waiting (the Delay column). Each counts once it has lasted while the game runs.

**Warehouses**: a cargo that fills 85 % of the room it has (its slots and the empty slots that take it), so there is time to act before it is full.

**Industries**: industries blocked from further expansion, which the game shows only in the industry's own window.
"""
good = [
  "The checks run in small slices a few times a minute, so they cost next to nothing.",
  "A button follows a change within a few seconds, a blocked industry within about half a minute.",
]

