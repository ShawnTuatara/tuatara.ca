modid = "tuatara_statistics_enhancements"
group = "enhancements"
order = 4
status = "soon"
publish = true
version = "0.7.13"
card = "Rank, sort, town cargo, coverage, vehicle and station columns; red problem buttons."
lead = "The statistics window sums up what you need in detail: a town's cargo as one figure, a station as one figure, a vehicle's balance without what it earned and cost. This mod adds a Rank column and largest-first sorting to every table, shows towns per cargo, vehicles with their income and running costs and stations terminal by terminal, and turns a statistics button in the game bar red when its table has something to look at."
description = "Statistics Enhancements for Transport Fever 3: a Rank column and largest-first sorting in every statistics table, town supply and demand per cargo, vehicle income and running costs, stations terminal by terminal, and statistics buttons that turn red on a problem."
hero = "SE-03c"
hero_alt = "The statistics window's Towns tab with a Rank column, Public Transport figures in green, yellow and red, and Demand and Supply per cargo."
compat = "Shares the statistics window with Line, Industry and Warehouse Enhancements, which add their own columns and views; the Rank column and the sorting work in those tables too. With Line Enhancements, its Assign Lines button stays at the right of the Stations tab's Lines column."

[[section]]
title = "Every statistics table"
features = ["rankColumn", "largestFirst", "scrollToTop"]

[[section]]
title = "Towns tab"
features = ["townCargoColumns", "townCargoFilter", "publicTransportCoverage"]

[[section]]
title = "Vehicles tab"
features = ["vehicleColumns"]

[[section]]
title = "Stations tab"
features = ["stationColumns"]

[[section]]
title = "Game bar"
features = ["problemButtons"]

# ---------------------------------------------------------------- every table

[feature.rankColumn]
where = ["statistics"]
why = "The statistics tables have no place numbers. To see where a town or a line stands, or how many rows a search leaves, you count down the list."
what = "Every statistics table starts with a Rank column: each row's place in the current order, so you can see where a town or line stands and count rows at a glance. With no column sorted, the rows are numbered as listed."
good = [
  "Rows with equal values share a place (1, 2, 2, 4): seven vehicles in Very Bad condition are all 1st, the next one is 8th.",
  "Only the rows the filters and the search leave are counted.",
]

[[feature.rankColumn.figure]]
shot = "SE-01"
alt = "The Towns tab sorted by population, with a Rank column from 1 to 11 before the town names."
caption = "The Towns tab, sorted by population with one click."
pins = [
  { n = 1, x = 3.5, y = 41.7, text = "Rank: each town's place in the current order." },
  { n = 2, x = 76.5, y = 25.5, text = "Sorted by population: the first click puts the largest town first (Sort Largest First)." },
]

[feature.largestFirst]
where = ["statistics"]
why = "In the game, the first click on a column header sorts smallest first, so the biggest towns, the busiest stations and the lines with the highest balance end up at the bottom of the list."
what = "The first click on a column header sorts largest first: most population, most cargo, highest balance. Names and other text columns still sort A to Z first, and the Towns tab's rating gauges (reputation, traffic, happiness, delivery, noise, pollution) sort worst first, so the towns with a problem come to the top. Click the header again for the other order."

[feature.scrollToTop]
where = ["statistics"]
why = "After a sort, a long table stays scrolled where it was, so the top of the new order is out of sight."
what = "Whenever you sort a table, it jumps back to its first row."

# ---------------------------------------------------------------- towns tab

[feature.townCargoColumns]
where = ["statistics"]
why = "The Towns tab shows one figure each for Supply, Demand and Coverage, summed over all cargos, and the cargos as a row of icons. You can't tell which cargo a town lacks without opening its window."
what = """
The four columns become two. Demand shows each cargo the town wants with its amount, largest first. Supply shows each cargo your lines supply with its amount, coloured by the share of its demand met, as the town window rates supplies: green from 67 %, yellow from 33 %, red below.
"""
good = [
  "Hover a supply figure for the cargo's supply of its demand in each district (residential, commercial, industrial), and for the whole town when more than one district wants it.",
  "Demand sorts by the town's total demand, Supply by the share of all demand met, as the game's Coverage column did.",
  "The Name, Population, Public Transport and Private Transport columns are narrower to make room.",
]

