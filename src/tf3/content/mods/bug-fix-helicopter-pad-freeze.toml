modid = "tuatara_bugfix_heli_pad_freeze"
group = "bugfixes"
order = 2
status = "live"
publish = true
modio = "https://mod.io/g/transportfever3/m/bug-fix-helicopter-pad-freeze"
version = "1.1"
card = "Frees helicopters frozen on a one-pad helipad, with a pop-up."
lead = "A helicopter that waits for a busy one-pad helipad can settle on it without ever arriving, blocking it for good. This mod sends it around to land again."
description = "Bug Fix - Helicopter Pad Freeze for Transport Fever 3: frees helicopters frozen on a one-pad helipad, such as an oil platform's, and tells you with a pop-up."
hero = "BF-HP-00"
hero_alt = "Before: a helicopter frozen on an oil platform's pad. After: it lands normally."
features = ["goAround"]
compat = "Works with any map and any other mod. The bug was found and the fix tested on game build 40425."

[feature.goAround]
where = ["background", "popups"]
why = """
A helicopter that has to wait for a busy one-pad helipad, an oil platform's for example, hovers near it. When it finally comes in from that hover it can settle on the pad without ever arriving: it stays en route, never unloads or boards, and blocks the pad, so every helicopter bound for that platform circles forever. It happens most on short hops between platforms, where helicopters fly low.
"""
what = """
The mod spots a frozen helicopter within seconds and does what the Reverse ("previous station") button does by hand: it reverses the helicopter off the pad and, once it is clear, reverses it again until it heads back for the same stop. It comes in again at speed and lands normally. If it freezes on the same pad again, it is sent on to the next stop instead.
"""
how = [
  "Subscribe and turn the mod on for your save.",
  "When a helicopter is freed, a small pop-up at the top of the screen says so; click it to jump to the helicopter.",
]
good = [
  "The pop-up has its own setting, Notification, so the fix can work silently.",
  "Without the mod, the same Reverse button frees a frozen helicopter by hand, as does sending it to its depot.",
  "It keeps nothing in your save, so it can be removed at any time, for example once the game itself is fixed.",
]

[[feature.goAround.figure]]
shot = "BF-HP-02"
alt = "The vehicle window's camera on a helicopter sitting on an oil platform's helipad at 0 km/h."
caption = "A frozen helicopter, seen through its vehicle window's camera: on the platform's only pad, but still en route."
pins = [
  { n = 1, x = 64, y = 44, text = "Sitting on the pad, yet the game still counts it as flying there: it never unloads or boards." },
  { n = 2, x = 76, y = 89, text = "0 km/h. Without help it stays like this, and every other helicopter for this platform circles." },
]

[[change]]
version = "1.1"
text = "First release."
