modid = "tuatara_company_enhancements"
group = "enhancements"
order = 9
status = "soon"
publish = true
version = "0.3.3"
card = "Population reached and needed for the next rank, and its change over 30 days."
lead = "Your company's ranks are earned by population, but the game bar never shows how close you are to the next one, or whether your towns are growing. This mod adds two counters beside Transported Passengers and Cargo: the population reached against the next rank's, and how much it changed over the last 30 days."
description = "Company Enhancements for Transport Fever 3: counters at the bottom of the screen for the population your company has reached, the population its next rank needs, and the population's change over 30 days."
compat = "Works with any map and any other mod. Both counters only read the game; the change counter keeps a short population record in your save."

[feature.populationCounter]
where = ["game-bar"]
why = """
Ranks are earned by population: the highest population all your towns together have reached. The company window shows it on each rank's card and the Company button gives a share of progress, but nothing on screen shows the figures while you play, or that your towns have started to shrink.
"""
what = """
A third counter beside Transported Passengers and Cargo at the bottom of the screen: the population your company has reached and the population its next rank needs, for example 48,210 / 52,000. They are the figures of the company window's rank card. When your towns have shrunk below the highest population reached, a red down arrow shows beside it.
"""
good = [
  "The reached figure never drops: it is the highest population seen, which is what the game counts for ranks. Today's population is in the tooltip while the red arrow shows.",
  "The tooltip gives the progress towards the next rank, as the Company button does.",
  "At the highest rank the counter shows the population alone.",
  "Hidden in the map editor and wherever the company has no ranks to earn, as the game's own Company button is.",
]

[[feature.populationCounter.figure]]
shot = "CO-01a"
alt = "The Population Counter: a population icon, 22,583, a small red down arrow, then / 26,763; at the right Population Change reads +13."
caption = "A world whose towns have shrunk a little since their highest population."
pins = [
  { n = 1, x = 20.5, y = 14, text = "22,583: the highest population all your towns together have reached. This is what earns ranks." },
  { n = 2, x = 34.0, y = 14, text = "The red arrow: your towns have shrunk below that figure since." },
  { n = 3, x = 64, y = 62, text = "26,763: the population your next rank needs." },
  { n = 4, x = 80.0, y = 62, text = "Population Change: the last 30 days' change, +13 here over the 5 days recorded so far. Its arrow comes once last week's value exists." },
]

[[feature.populationCounter.figure]]
shot = "CO-01b"
alt = "The counter's tooltip: Reach a Population of 26,763. 24% of progress towards Director. Population now: 22,580 (-3)."
caption = "Its tooltip, in the same world."
pins = [
  { n = 1, x = 62.8, y = 33, text = "The population the next rank needs, as on the rank's card in the company window." },
  { n = 2, x = 70.5, y = 60, text = "How far you are towards the next rank, as the Company button shows it." },
  { n = 3, x = 62, y = 82, text = "Today's population and how far it is below the highest reached; shown only while the red arrow is." },
]

[feature.populationTrend]
where = ["game-bar"]
why = """
The game keeps no daily record of its population, so there is no way to tell whether your towns are growing faster or slower than a few weeks ago, or have started to shrink.
"""
what = """
A counter beside the Population Counter, with a house and arrow icon: how much the population of all towns changed over the 30 days before the start of the week, green when it grew (+1,234) and red when it shrank (-1,293). An arrow beside it compares it with last week's value: up when larger, down when smaller, = when the same.
"""
good = [
  "It is updated once a week, on Monday, and stays put in between.",
  "The tooltip gives the dates and populations, last week's value and the date of the next update.",
  "The mod notes the population once a day and keeps the last few weeks in your save. In a save new to the mod the first value comes on the next Monday, over the days recorded so far, and the arrow once 30 days are recorded.",
  "That record is all the mod keeps in your save, and the mod can be removed at any time.",
]

