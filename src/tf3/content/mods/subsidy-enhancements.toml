modid = "tuatara_subsidy_enhancements"
group = "enhancements"
order = 8
status = "soon"
publish = true
version = "1.0"
card = "How long an offer stays open, how long a reward runs, and a countdown ring on every subsidy notice."
card_image = "SU-03c"
lead = "A subsidy offer is withdrawn after about six months, and a fulfilled subsidy's reward runs for years, but the game shows neither time left, and only a subsidy in progress has a ring in the notification list. This mod adds both countdowns and gives every subsidy notice a countdown ring, coloured by phase."
description = "Subsidy Enhancements for Transport Fever 3: shows how long a subsidy offer stays open and how long a fulfilled subsidy's reward runs, and gives every subsidy notification a countdown ring, coloured by phase."
intro = """
A subsidy goes through three phases: an offer, which you accept or decline; in progress, once accepted, with the game's countdown to fulfil it; and, once fulfilled, a reward that runs for a set time. The game shows a countdown only while it is in progress.
"""
compat = "Works with any map and any other mod. Only the display changes: subsidies, their timing and their rewards stay as the game sets them. The mod saves nothing with your game, so it can be removed at any time."

# The offer bars, the reward bars and the rings are one setting, Countdowns (countdowns); each part
# keeps its own block, with setting = "countdowns" and its own title.
features = ["offerCountdown", "rewardCountdown", "countdownRings"]

[[section]]
title = "Countdowns"
features = ["offerCountdown", "rewardCountdown", "countdownRings"]

[feature.offerCountdown]
setting = "countdowns"
title = "Offer countdown"
where = ["notifications", "subsidies"]
why = """
A subsidy offer stays open for about six months, then it is withdrawn with a Subsidy Missed notification. The game never shows how long you have left to accept it, and the calendar line on the offer is easily taken for that: it is the time you get to fulfil the subsidy once you accept.
"""
what = """
An offer you haven't accepted shows its time left as a bar, drawn like the countdown the game shows once a subsidy is accepted: in the Subsidy Available notification and in the subsidy's window, under Decline and Accept. The bar empties as the offer runs out.
"""
good = [
  "An offer lasts six months, give or take 30 days, so the time left differs from offer to offer.",
  "The calendar line on an offer still shows the time you get to fulfil it once accepted.",
]

[[feature.offerCountdown.figure]]
shot = "SU-01a"
alt = "A Subsidy Available notification for a connection between Halesworth and Pontefract, with a bar reading 4 Months 24 Days."
caption = "An offer to connect Halesworth and Pontefract, in the notification list."
pins = [
  { n = 1, x = 94, y = 85, text = "4 months 24 days left to accept; the bar empties as the offer runs out." },
]

[[feature.offerCountdown.figure]]
shot = "SU-01b"
alt = "The Connect Towns window of the same offer: Task with a calendar line of 9 Months 22 Days, rewards and penalties, Decline and Accept, and under them a bar reading 4 Months 24 Days."
caption = "The same offer's window."
pins = [
  { n = 1, x = 44, y = 36, text = "The game's calendar line: 9 months 22 days to fulfil the subsidy once accepted, not the time left to accept." },
  { n = 2, x = 86, y = 96.5, text = "The time left to accept, under Decline and Accept." },
]

[feature.rewardCountdown]
setting = "countdowns"
title = "Reward countdown"
where = ["notifications", "subsidies"]
why = """
Once a subsidy is fulfilled, its reward runs for a set time: 2x income on the supplying lines, or on the connection, for five years. Its Subsidy Effect Active notification shows no time left, so you can't tell at a glance when the extra income ends.
"""
what = """
A fulfilled subsidy shows a bar with its reward's time left, in its notification and in its window, under the game's completed mark. The bar empties as the reward runs out.
"""
good = [
  "A subsidy for transporting workers has a shorter reward: 3 months.",
]

[[feature.rewardCountdown.figure]]
shot = "SU-02b"
alt = "A Subsidy Effect Active notification for supplying Macclesfield with cargo, with a bar reading 1 Year 10 Months 14 Days."
caption = "A fulfilled subsidy for supplying Macclesfield, in the notification list."
pins = [
  { n = 1, x = 94, y = 69, text = "1 year 10 months 14 days of the reward left, out of five years." },
]

[[feature.rewardCountdown.figure]]
shot = "SU-02"
alt = "The Supply Town window of a fulfilled subsidy for Attleborough: Task, On Fulfillment with 2x Income for 1 Year 3 Months 15 Days on All Supplying Lines, the completed mark, and a bar reading 1 Year 3 Months 15 Days."
caption = "A fulfilled subsidy's window: 2x income on the lines supplying Attleborough."
pins = [
  { n = 1, x = 25.5, y = 70, text = "The game names the time left in the reward's line." },
  { n = 2, x = 85, y = 93.5, text = "The bar shows how much of the reward is left, under the completed mark." },
]

[feature.countdownRings]
setting = "countdowns"
title = "Countdown rings"
where = ["notifications"]
why = """
In the notification list, the game draws a countdown ring around a subsidy's icon only while the subsidy is in progress, always in white. An offer and a running reward get no ring, and the icon is the same in every phase, so you hover each tile to tell them apart.
"""
what = """
Every subsidy tile has a countdown ring showing its time left: an offer's time to accept, an accepted subsidy's time to fulfil, a fulfilled subsidy's reward. The rings are coloured by phase: white for an offer, yellow while in progress, green while the reward runs.
"""
good = [
  "The ring fills from the notification's countdown, as the game's own ring does, and hovering a tile shows the game's card.",
]

[[feature.countdownRings.figure]]
shot = "SU-03d"
alt = "Four subsidy tiles in the notification list: two with green rings, one with a yellow ring and one with a white ring."
caption = "Four subsidies in the notification list."
