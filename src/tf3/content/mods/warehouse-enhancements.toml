modid = "tuatara_warehouse_enhancements"
group = "enhancements"
order = 5
status = "soon"
publish = true
version = "0.1.13"
card = "What each warehouse slot really holds, and which cargo fills up next."
card_image = "site/card-warehouse-enhancements.webp"
lead = "A warehouse stores cargo in slots of 500, one cargo per slot, but the game adds them all together: a warehouse can read 40 % while one cargo is full and can't be unloaded. This mod shows each slot, which cargo your lines bring, and which cargo needs action first."
description = "Warehouse Enhancements for Transport Fever 3: shows each warehouse's slots, the slots held for cargo your lines bring, and which cargo fills up next, in the statistics window and the warehouse window."
intro = """
A warehouse has one slot of 500 per module. Each slot has a kind, such as Bulk, Goods or Liquid, and holds one cargo at a time. An empty slot takes any cargo of its kind, unless you pin it to one cargo in the warehouse window.

The mod works out each cargo's room from its own slots and the free slots that take it, and reads which of your lines unload or load at the warehouse now. An empty slot that a line's cargo will need is held for that cargo, so it doesn't count as free.
"""
compat = "Works alongside [Cargo Enhancements](mod:cargo-enhancements), whose Consumers and Suppliers card shares the warehouse window, [To-Do List](mod:todo-list), and [Statistics Enhancements](mod:statistics-enhancements), whose Rank column shows in the Warehouses tab too."
features = ["statisticsTab", "stocksCard"]

[feature.statisticsTab]
where = ["statistics"]
why = "The statistics window's Warehouses tab lists every cargo a warehouse could take and adds all its slots into one Stored, Capacity and Utilization. A warehouse reads 82 % while its crude oil has room for 3 more, and nothing in the table says which cargo is about to fill up."
what = "Each warehouse's slots show as a strip of tiles, grouped by kind. Free counts the free slots no cargo is held for, Next Full names the cargo that needs action first, and the arrow column shows that cargo's change over the last year. Problems get a mark in the Problems column."
good = [
  "A tile is green when one of your lines unloads that cargo there now, grey when none does, and red when the cargo is full.",
  "An outlined tile is a free slot, or one held for a cargo a line brings that is out of stock right now. A filter icon marks a pinned slot.",
  "Next Full, most urgent first: **No slot**, **Shared slot** (two cargos want the last free slot), **None brought** (lines come to load a cargo nothing brings), **Full**, **Pin unused** (a pinned slot nothing is brought to), then the time until full, yellow within a year.",
  "The time until full counts only cargo one of your lines brings now.",
  "Sort by Next Full, largest first, to put the warehouses that need action at the top. Click a Problems mark to open the warehouse.",
]

