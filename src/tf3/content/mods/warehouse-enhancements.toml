[feature.stocksCard]
where = ["warehouse-window"]
why = "The warehouse window's Stocks card shows how much of each cargo is stored and its room, but not whether it is rising, when it will be full, or which of your lines bring it. A cargo out of stock right now isn't listed, though its next delivery needs a slot."
what = "For each cargo, the card shows its room, its change over the last year, the time until full, and whether a line unloads it there. Expanded, the slot list says which slot is held for which cargo and ends with the lines that unload or load at the warehouse."
how = [
  "Open a warehouse: the cargo columns show at once.",
  "Expand the Stocks card for the slot list and the lines. Click a line to open it.",
]
good = [
  "A cargo's icon is green when a line unloads it there now and red on a problem: no slot left, a pinned cargo nothing is brought to, or a cargo lines come to load that nothing brings. Hover it for the reason.",
  "When two cargos need the last free slot, both show in red, since whichever line arrives first takes it.",
  "A held slot names the cargo it is held for. Click that cargo's icon to pin the slot to it.",
  "A cargo with no slot left gets a red row in the slot list, with the lines that bring it.",
  "The cargo columns also show for warehouses that aren't yours; the slot list, as in the game, only for your own.",
]

