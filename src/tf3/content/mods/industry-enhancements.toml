modid = "tuatara_industry_enhancements"
group = "enhancements"
order = 3
status = "soon"
publish = true
version = "0.7.12"
card = "Correct figures for industries with two recipes, every worker and what they are doing, plot growth, and columns for comparing industries."
card_image = "site/card-industry-enhancements"
lead = "The industry window and the statistics window's Industries tab leave out much of what decides an industry's output: the canning factory's second recipe shows the first one's figures, workers who don't count for the worker boost appear nowhere, and nothing says when a farm or mine will grow. This mod corrects the figures, lists every worker and what each one is doing, shows when raw producers next try to grow, and gives the Industries tab columns, a cargo filter and a mark for industries that can't expand."
description = "Industry Enhancements for Transport Fever 3: corrects the figures of industries with more than one recipe, shows the workers the worker boost ignores and what each worker is doing, when raw producers next try to grow, and adds columns, a cargo filter and a blocked-expansion mark to the statistics Industries tab."
compat = "Works alongside [Cargo Enhancements](mod:cargo-enhancements) and [To-Do List](mod:todo-list), whose cards share the industry window, and [Statistics Enhancements](mod:statistics-enhancements), whose Rank column and sorting work in the Industries tab too and whose [Problem Buttons](mod:statistics-enhancements#problem-buttons) turn the Industries button red while an industry is blocked from further expansion."

[[section]]
title = "Industry window"
features = ["recipeFigures", "plotGrowth", "inactiveWorkers", "workerStatus"]

[[section]]
title = "Statistics window"
features = ["industryColumns", "statisticsTotals", "blockedExpansion", "cargoFilter"]

[feature.recipeFigures]
where = ["industry-window"]
why = "An industry with more than one recipe, such as the canning factory (fish or meat, each with sheet metal), shows the first recipe's figures again on later rows. The meat row repeats the fish figures, so you can't tell how much meat the factory takes."
what = "Every recipe row of the Production card shows its own cargos' figures. A cargo both recipes use, such as sheet metal, shows the industry's total on each row."

