[feature.industryColumns]
where = ["statistics"]
why = "The game's Industries tab gives Input, Output and Shipment as one number each and the boosters as icons. How much of each cargo an industry takes or makes, how much a booster adds and how large a raw producer may grow are only in each industry's window, so comparing industries means opening them one by one."
what = "The Industries tab gets the columns Name, Problems, Plots, Recipe In, Recipe Out, Workload, Input, Output, Shipment, Boosters and Workplaces. Recipe In and Recipe Out give each recipe's cargos a year without boosts, a line per recipe. Input, Output and Shipment show an icon and amount per cargo. Boosters and Workplaces show how much each booster and the worker boost add to production, in green while on."
good = [
  "Plots shows a raw producer's plots built of the most it may have (5/8) and the next try to grow, as [Plot Growth](#plot-growth) does in the Production card. Sort by it to find the producers that can grow largest.",
  "Input is about Recipe In × Workload × (1 + boost). The boosts on now show in green beside Workload.",
  "Recipe In and Recipe Out sort by the largest cargo, Input, Output and Shipment by the sum. Boosters and Workplaces sort the boosts that are on first, then by how much they add.",
  "Requirements is left out, since Input shows the same cargos.",
]

