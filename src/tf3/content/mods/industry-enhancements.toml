[feature.workerSources]
where = ["industry-window"]
why = "The worker boost needs workers who come by your lines, but the industry window doesn't show which towns they could come from. The game draws arrows from nearby towns only for a worker subsidy."
what = "Expanding an industry's Boosters card draws arrows from the towns its workers can come from: the 5 closest towns, the ones a worker subsidy shows, and any town that sends workers now. An arrow moves only while its town sends workers; a still, white arrow is a town that could."
good = [
  "A booster cargo, such as tools, is an input: its suppliers are in the Input Stocks card, with Cargo Enhancements' filters.",
]

[[feature.workerSources.figure]]
