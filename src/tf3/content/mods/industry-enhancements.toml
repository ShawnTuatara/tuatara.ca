[feature.inactiveWorkers]
where = ["industry-window", "statistics"]
why = "The worker boost counts only workers who arrived by your lines in the last 2 years. The Boosters card shows only their count and lists only them, so workers who walk, drive or stopped coming by line appear nowhere."
what = "The Boosters card's count adds the others in brackets: 11 (8)/10 means 11 came by line, 8 more work there, and 10 are needed for the boost. The expanded list shows the others below at 0 %, each with how they get to work (walking, car or lines), or a button to the new workplace of a worker who now works elsewhere, and a button to their home."
how = ["Open an industry with workplaces.", "Read the Boosters card's count; expand the card for the list."]
good = [
  "The boost needs workers by line in half the workplaces: the last figure of the count.",
  "Point at a home button for the town; sort by it to group workers by town.",
  "With [Worker Status](#worker-status) on, the list shows Worker Status's columns instead.",
]
also = "The statistics Industries tab's Workplaces column shows the same count, with the filled workplaces in the tooltip."

