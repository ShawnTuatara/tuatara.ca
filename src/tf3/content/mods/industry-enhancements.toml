[feature.plotGrowth]
where = ["industry-window"]
why = "A mine, farm or forest grows one plot at a time, which raises its output. The game tries every half year, with a chance from how well it produces and how much of its output your lines ship, and shows none of it."
what = "Under a raw producer's plots, the Production card shows the plots built of the most it may have (15/20) and when the game next tries to add one (43 days): green when it will succeed, yellow when it may, grey when it can't."
good = [
  "The chance comes from production × the share your lines ship: none at 25 % or less, sure from 75 %.",
  "Point at the next try for the chance and what it is made of.",
  "Only raw producers grow; processing industries never do. Once every plot is built, the next try is left out.",
  "An industry [blocked from further expansion](#blocked-expansion) still gets its tries, but a plot only comes when there is room for it.",
]
also = "The statistics Industries tab's Plots column ([Statistics - Column Enhancements](#statistics-column-enhancements)) shows the same."

