[feature.workerStatus]
where = ["industry-window", "statistics"]
why = """
The worker boost counts only workers who arrived by your lines in the last 2 years, and the Boosters card shows and lists only them: workers who walk, drive or stopped coming by line appear nowhere.

The list also says who works here, not what they are doing: stuck at a stop for months, walking, or already at work.
"""
what = """
The Boosters card's count adds the other workers in brackets: 11 (8)/10 means 11 came by line, 8 more work there, and 10 are needed for the boost. The statistics Industries tab's Workplaces column shows the same count.

The worker list shows every worker, those who don't count for the boost at 0 %, with what each is doing now: at home, shopping or at work (green), walking, driving, waiting at a stop (a stopwatch and the vehicle they wait for), or riding, with a dot in the line's colour. Then where the trip goes, for how many days, the worker's happiness, how far their home town is, and Time Left as a % from red (0 %) to green (100 %).
"""
good = [
  "The boost needs workers by line in half the workplaces: the last figure of the count.",
  "Point at Now for the line, the stop and where the worker gets off; click it to open the worker's window.",
  "Click the trip's destination to open that building. A grey workplace marks a worker who now works elsewhere.",
  "A wait over 30 days shows in red, since it makes people unhappy. \"12 d+\" means at least 12 days: the state began before this session.",
  "Point at the home distance for the town, click it to open the home, or sort by it to see who comes from the same town.",
  "The name moves into the location button's tooltip. The list starts with the workers on their way here, the longest under way first, and every column sorts.",
]

