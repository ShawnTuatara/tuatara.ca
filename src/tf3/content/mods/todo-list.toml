modid = "tuatara_todo_list"
group = "enhancements"
order = 10
status = "soon"
publish = true
version = "0.7.11"
card = "A to-do list per save, with tasks linked to towns, industries, lines and more."
card_image = "TD-01"
lead = "A to-do list saved with each game, to keep track of what you want to build, fix or check next. Tasks can link to towns, industries, stations, lines and warehouses, whose windows then show the tasks about them."
description = "To-Do List for Transport Fever 3: a to-do list saved with each game, with tasks linked to the towns, industries, stations, lines and warehouses they are about."
compat = "Works with any map and any other mod. Its To-Do card takes its place among the cards the Enhancements mods add to the same windows."

[feature.todoList]
where = ["mod-buttons"]
why = """
Building a network leaves loose ends: a line to add, a warehouse to watch, a farm still without workers. The game has nowhere to note them, and a note outside the game doesn't know which save it belongs to.
"""
what = """
A checklist button beside Data Layers at the top left opens the save's to-do list, with a To Do and a Done tab. Add tasks, tick them off, put them in order, edit or delete them.
"""
how = [
  "Click the checklist button beside Data Layers.",
  "Click + to add a task at the top, type it and press Enter.",
  "Tick a task to move it to the Done tab; untick it there to bring it back.",
  "Drag a task by its grip to reorder it: a blue bar shows where it will land, as with stops in the Line Manager.",
]
good = [
  "The bulldozer on the Done tab deletes all done tasks at once.",
  "The list and a data layer's legend share their place: opening one closes the other.",
  "Every save has its own list, saved with the game. Turned off in the mod's Settings, the list stays in the save.",
  "Removing the mod deletes the list from that save the next time it is loaded; nothing else of the mod stays in the save.",
]

[[feature.todoList.figure]]
shot = "TD-01"
alt = "The To-Do List window: To Do (8) and Done (7) tabs, filter buttons, an eye and a plus, then eight tasks, most tagged with the stations, industries and towns they are about."
caption = "Eight open tasks, the first long enough to wrap; most are linked to something on the map."
pins = [
  { n = 1, x = 50.5, y = 13.3, text = "Filter buttons, one per kind of element, and the eye: only the tasks about something on screen." },
  { n = 2, x = 91.9, y = 13.3, text = "+ adds a task at the top." },
  { n = 3, x = 2.6, y = 35.1, text = "Drag a task by its grip to reorder it; tick it when it's done." },
  { n = 4, x = 90, y = 35.1, text = "Edit or delete a task." },
  { n = 5, x = 55.7, y = 79.7, text = "A tag links the task to a town, here Haverhill: click it to go there and open its window." },
]

[[feature.todoList.figure]]
shot = "TD-02"
alt = "The Done tab with one ticked, greyed task and a bulldozer button at the right."
caption = "The Done tab."
pins = [
  { n = 1, x = 9, y = 43, text = "Untick a task to bring it back to To Do." },
  { n = 2, x = 93.5, y = 41, text = "The bulldozer deletes all done tasks at once." },
]

[feature.elementLinks]
where = ["town-window", "industry-window", "station-window", "line-window", "warehouse-window"]
also = "The list's filter buttons and eye come with this setting too."
why = """
A task is usually about something on the map: a town, an industry, a line. Finding it again means searching the map or the statistics window, and opening a town's window doesn't remind you of what you meant to do there.
"""
what = """
Tasks can link to towns, industries, stations, lines and warehouses. Their windows get a To-Do card: how many open tasks are about this element, a + to start a new task about it, and a chain to add it to the task picked in the To-Do window (it works only while that window is open with a task clicked). Expanded, the card lists those tasks, each with a tick box and buttons to edit or delete it. In the list, each linked element shows as a tag under the task's text: click it to go there and open its window.
"""
how = [
  "Open a town, industry, station, line or warehouse and find its To-Do card.",
  "Click + to start a task about it. To add this element to an existing task, open the To-Do window, click the task there, then click the chain on the element's card.",
  "Click the card to expand it and work through its tasks without opening the list.",
]
good = [
  "The checked box in the card adds the tasks already done.",
  "In the list, filter buttons show only the tasks about towns, industries, stations, lines or warehouses, and the eye only those about something on screen.",
  "A tag greys out once its element is gone.",
]

