pins = [
  { n = 1, x = 21, y = 56, text = "Open tasks about this town; a click opens them in the list." },
  { n = 2, x = 69.2, y = 56, text = "Adds the tasks already done to the card." },
  { n = 3, x = 78.9, y = 56, text = "+ starts a new task about this town." },
  { n = 4, x = 87.4, y = 56, text = "The chain links the town to a task: with the To-Do window open, click a task there, then the chain. Greyed while the window is closed, no task is picked, or the task already has this town." },
  { n = 5, x = 55, y = 69.4, text = "The tasks about it: tick, edit or delete them here." },
]

