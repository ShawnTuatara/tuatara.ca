# Landing page, "find it" windows, research cards and the install page.
# Text fields take inline markup: `code`, **bold**, [text](url); url may be mod:<slug>#anchor or page:<path>.

title = "Transport Fever 3 mods by tuatara"
description = "Transport Fever 3 mods by tuatara: what each mod adds, feature by feature, with annotated in-game screenshots."
build = "40444"

[hero]
title = "Transport Fever 3 mods"
lead = "Small, focused additions to the game's own windows: clearer figures, the numbers the game keeps but never shows, and fixes for bugs found along the way."
shot = "hero-cargo-demand"
alt = "The Line Manager adding a stop to a delivery line: town districts in colour, markers on buildings that take the cargo, the line's vehicles with their load and status, and a tooltip naming what the new stop would reach."

[[how]]
title = "One mod per game system"
text = "Lines, cargo, industries, statistics, warehouses and more. Pick the areas you want."

[[how]]
title = "One switch per feature"
text = "Each feature has its own Off / On setting under the mod's gear when you choose a save's mods."

[[how]]
title = "Built into the game's windows"
text = "Features show up where the game already shows that information, in its own style."

[[how]]
title = "Quiet by default"
text = "A Logging switch, off by default, writes the mod's messages to the game log for bug reports."

research_lead = "Game bugs found while building these mods, measured, reported to Urban Games, and worked around."

[[research]]
title = "Pedestrians who never cross"
text = "At signalised crossings in every town of a test map, the walk phase stopped coming on while crowds waited, some for months. Reported with figures from a watch tool, and worked around."
links = [
  { label = "Forum report", url = "https://forum.urbangames.com/forum/index.php?thread/4697-bug-traffic-lights-skip-the-pedestrian-phase-while-pedestrians-wait-also-with-al/" },
  { label = "Crosswalk Queue fix", mod = "bug-fix-crosswalk-queue", url = "https://mod.io/g/transportfever3/m/bug-fix-crosswalk-queue" },
]

[[research]]
title = "Passengers who never board"
text = "Passengers who queue at an overcrowded stop are never picked up afterwards: buses of their line leave with seats free while they keep waiting."
links = [
  { label = "Forum report", url = "https://forum.urbangames.com/forum/index.php?thread/4703-bug-passengers-who-queue-at-an-overcrowded-stop-never-board-afterwards-buses-lea/" },
  { label = "Stuck Passengers watch", mod = "bug-watch-stuck-passengers", url = "https://mod.io/g/transportfever3/m/bug-watch-stuck-passengers" },
]

[[research]]
title = "Helicopters frozen on the pad"
text = "Traced landing by landing: a helicopter that hovers low while waiting for a one-pad helipad sinks onto the deck and never arrives, blocking the pad for every other helicopter."
links = [
  { label = "Forum report", url = "https://forum.urbangames.com/forum/index.php?thread/4590-bug-helicopters-freeze-on-a-one-pad-oil-platform-after-waiting-to-land/" },
  { label = "Helicopter Pad Freeze fix", mod = "bug-fix-helicopter-pad-freeze", url = "https://mod.io/g/transportfever3/m/bug-fix-helicopter-pad-freeze" },
]

[[research]]
title = "Planes that skip waypoints"
text = "Where a plane's descent replaces its planned route with a straight-in approach, dropping the waypoints still ahead, and where a last waypoint survives."
links = [
  { label = "Descent Zones", mod = "line-enhancements" },
]

