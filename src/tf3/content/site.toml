[install]
title = "Installing the mods"
lead = "The mods come from mod.io through the game's own Mod Hub. Each save picks its own mods and settings."

[[install.section]]
title = "Get a mod"
steps = [
  "In the game's main menu, open the **Mod Hub**.",
  "Search for the mod by name (or for tuatara) and subscribe. The game downloads it.",
]
after = "Mods marked Coming soon aren't on mod.io yet."

[[install.section]]
title = "Turn it on for a save"
steps = [
  "Start a new game, or in Load Game pick a save, and open its **Mods**.",
  "Switch the mod on. Each save keeps its own list.",
]

[[install.section]]
title = "Choose its features"
text = "Every feature of a mod has its own switch, and most are on by default."
steps = [
  "In the same mod list, click the **gear** next to the mod.",
  "Under **Settings**, set each feature Off or On.",
]
after = "Off turns a feature off completely: its buttons and columns are gone and it does no work in the background."
[install.section.figure]
shot = "GEN-01"
alt = "Line Enhancements' Settings: an Off / On switch for each of its features, Logging last and Off"
caption = "Line Enhancements' Settings."
pins = [
  { n = 1, x = 55.5, y = 7.8, text = "One switch per feature, in the order the features show in the game." },
  { n = 2, x = 46.5, y = 95.7, text = "Logging, last and off by default: turn it on only to report a problem." },
]

[[install.section]]
title = "Report a problem"
steps = [
  "Turn the mod's **Logging** setting on (it is off by default).",
  "Play until the problem shows again, then quit the game.",
  "Find the game log: `Steam\\userdata\\<your Steam id>\\3493540\\local\\crash_dump\\stdout.txt`.",
  "Describe what happened in the comments on the mod's mod.io page, and mention the log.",
]
